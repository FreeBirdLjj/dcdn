[package]
name = "dcdn"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
fast-socks5 = "1.0.0"
futures-util = "0.3.34"
httparse = "1.10.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
socket2 = "0.6.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "io-util", "sync", "signal", "macros", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rcgen = "0.14.9"
